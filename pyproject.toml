[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-quality-poc"
version = "0.1.0"
description = "Skeleton workspace for AI Data Quality PoC"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.37,<2",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "psycopg[binary]>=3.2,<4",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "alembic>=1.13,<2",
  "types-PyYAML>=6.0.12,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["I001"]
"alembic/versions/*.py" = ["E501", "I001"]
"src/ai_data_quality_poc/storage/seeding.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true


